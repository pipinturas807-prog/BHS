                                                            <p className="text-[10px] text-zinc-600 line-clamp-2 uppercase font-medium mb-3">
                                                                {t.description || 'Sin observaciones adicionales.'}
                                                            </p>
                                                        </div>
                                                        <div className="flex justify-between items-center pt-2 border-t border-zinc-100 text-[9px] font-bold">
                                                            <span className="text-zinc-500 uppercase"><span className="text-black font-bauhaus">Asignado:</span> {t.assignedTo}</span>
                                                            <button 
                                                                onClick={() => updateTaskStatus(t.id, 'completed')}
                                                                className="bg-emerald-500 hover:bg-emerald-600 text-white p-1 border border-black px-2.5 transition-colors font-bold shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]"
                                                            >
                                                                Listo
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* Importador / Exportador de respaldos manuales (SOLO ADMIN) */}
                                {currentUser.role === 'admin' && (
                                    <div className="bg-white border-4 border-black p-4 md:p-8 shadow-[8px_8px_0px_0px_rgba(227,6,19,1)] flex flex-col md:flex-row gap-6 justify-between items-center">
                                        <div className="max-w-xl">
                                            <div className="border-b-2 border-black pb-2 mb-2 flex items-center gap-2">
                                                <span className="bg-[#e30613] text-white font-bauhaus text-[8px] uppercase px-2 py-0.5 font-bold">Área Administrativa</span>
                                                <h3 className="font-bauhaus text-base uppercase">Resguardo General de Información</h3>
                                            </div>
                                            <p className="text-[10px] text-zinc-600 font-bold uppercase leading-relaxed">
                                                Utilice esta herramienta para descargar una copia local física de todas las tareas y perfiles de colaboradores de la tienda de Barcelona o importar un backup previo.
                                            </p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto shrink-0">
                                            <button 
                                                onClick={handleExportBackup}
                                                className="bg-black hover:bg-[#e30613] text-white p-3 font-bauhaus text-[9px] uppercase border-2 border-black flex items-center justify-center gap-2 transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none"
                                            >
                                                <Icons.Download /> Exportar Copia Backup
                                            </button>

                                            <div className="border-2 border-dashed border-zinc-300 hover:border-black p-3 text-center relative bg-neutral-50 transition-colors cursor-pointer flex items-center justify-center min-w-[150px]">
                                                <input 
                                                    type="file" 
                                                    accept=".json" 
                                                    onChange={handleImportBackup}
                                                    className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                                                />
                                                <div className="flex items-center gap-2">
                                                    <Icons.Upload />
                                                    <span className="font-bauhaus text-[8px] uppercase font-bold">Cargar Backup</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}

                        {view === 'tasks' && (
                            <div className="space-y-6">
                                {/* Selector de Filtrado con Leyenda Integrada en el Listado */}
                                <div className="bg-white border-4 border-black p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 shadow-[5px_5px_0px_0px_rgba(0,0,0,1)]">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-black text-white p-1 px-2 text-[10px] font-bauhaus uppercase flex items-center gap-1">
                                            <Icons.Filter /> Filtrar
                                        </span>
                                        <h3 className="font-bauhaus text-xs md:text-sm uppercase">Filtrar Listado General</h3>
                                    </div>

                                    <div className="flex items-center gap-3 w-full sm:w-auto">
                                        <span className="font-bauhaus text-[9px] uppercase text-zinc-500 whitespace-nowrap">Sección:</span>
                                        <select 
                                            value={selectedListSection} 
                                            onChange={(e) => setSelectedListSection(e.target.value)}
                                            className="p-2.5 border-2 border-black uppercase text-[10px] font-bold bg-white focus:outline-none w-full sm:w-64"
                                        >
                                            <option value="TODAS">🔍 Mostrar Todas las Secciones</option>
                                            {Object.entries(sectionColors).map(([name, style]) => (
                                                <option key={name} value={name}>
                                                    {style.icon} {name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {isMobile ? (
                                    /* Tarjetas móviles adaptables */
                                    <div className="space-y-4">
                                        {listFilteredTasks.length === 0 ? (
                                            <div className="bg-white border-2 border-dashed border-black p-8 text-center uppercase font-bauhaus text-xs text-zinc-400">
                                                No hay tareas que coincidan con la sección seleccionada
                                            </div>
                                        ) : (
                                            listFilteredTasks.map(t => {
                                                const sStyle = getSectionStyle(t.section);
                                                return (
                                                    <div key={t.id} className="bg-white border-4 border-black p-4 shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] relative flex flex-col justify-between gap-4">
                                                        <div>
                                                            <div className="flex items-start justify-between gap-2">
                                                                <h4 className="font-bauhaus text-sm text-neutral-900 uppercase break-words leading-tight">{t.title}</h4>
                                                                <span className={`shrink-0 text-[8px] font-bauhaus px-2 py-0.5 uppercase ${t.status==='completed'?'bg-emerald-100 text-emerald-600':'bg-amber-100 text-amber-600'}`}>
                                                                    {t.status}
                                                                </span>
                                                            </div>
                                                            <div className="mt-2 space-y-1.5 text-[9px] font-bold text-zinc-500">
                                                                <p className="uppercase">
                                                                    <span className="text-black font-bauhaus">SECCIÓN:</span> 
                                                                    <span className={`ml-1 px-1.5 py-0.5 text-white text-[8px] ${sStyle.bg} border ${sStyle.border}`}>
                                                                        {sStyle.icon} {t.section || 'N/D'}
                                                                    </span>
                                                                </p>
                                                                <p className="uppercase"><span className="text-black font-bauhaus">OPERARIO:</span> {t.assignedTo || 'N/D'}</p>
                                                                <p className="text-[8px] text-zinc-400 font-medium">{t.createdAt}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-2 w-full pt-2 border-t border-zinc-100">
                                                            <button 
                                                                onClick={() => setActiveMobileTask(t)}
                                                                className="flex-grow bg-black text-white p-2.5 font-bauhaus text-[9px] uppercase border-2 border-black active:bg-zinc-800"
                                                            >
                                                                Ver Detalles
                                                            </button>
                                                            {t.status !== 'completed' && (
                                                                <button 
                                                                    onClick={() => updateTaskStatus(t.id, 'completed')} 
                                                                    className="bg-emerald-500 text-white p-2.5 px-4 font-bauhaus text-[9px] uppercase border-2 border-black active:bg-emerald-600"
                                                                >
                                                                    Completar
                                                                </button>
                                                            )}
                                                            {currentUser.role === 'admin' && (
                                                                <button 
                                                                    onClick={() => setConfirmDelete(t.id)} 
                                                                    className="border-2 border-black text-[#e30613] p-2.5 active:bg-red-50 flex items-center justify-center"
                                                                >
                                                                    <Icons.Trash />
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                ) : (
                                    /* Tabla de escritorio de alta densidad */
                                    <div className="bg-white border-4 border-black shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
                                        <table className="w-full text-left">
                                            <thead className="bg-black text-white font-bauhaus text-[10px] uppercase">
                                                <tr>
                                                    <th className="p-4">Tarea</th>
                                                    <th className="p-4">Sección</th>
                                                    <th className="p-4">Encargado</th>
                                                    <th className="p-4">Estado</th>
                                                    <th className="p-4 text-right">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y-2 divide-zinc-100">
                                                {listFilteredTasks.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="5" className="p-8 text-center uppercase font-bauhaus text-xs text-zinc-400">
                                                            No hay tareas que coincidan con la sección seleccionada
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    listFilteredTasks.map(t => {
                                                        const sStyle = getSectionStyle(t.section);
                                                        return (
                                                            <tr key={t.id} className="text-[10px] font-bold uppercase hover:bg-neutral-50 transition-colors relative group">
                                                                <td className="p-4 cursor-pointer relative">
                                                                    <div>
                                                                        <div className="flex items-center gap-2">
                                                                            <p className="font-bauhaus text-neutral-900">{t.title}</p>
                                                                            {t.id.startsWith("temp-") && (
                                                                                <span className="text-[7px] bg-amber-400 text-black px-1 py-0.2 font-bauhaus tracking-wider rounded-sm select-none font-bold">
                                                                                    LOCAL
                                                                                </span>
                                                                            )}
                                                                            {!t.id.startsWith("temp-") && (
                                                                                <span className="text-[7px] bg-[#e30613] text-white px-1 py-0.2 font-bauhaus tracking-wider rounded-sm select-none font-bold">
                                                                                    NUBE
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                        <p className="text-zinc-400 text-[8px] mt-1">{t.createdAt}</p>
                                                                    </div>

                                                                    {/* Ficha de detalles emergente interactiva al pasar el cursor (Hover) */}
                                                                    <div className="absolute left-6 top-12 hidden group-hover:flex flex-col bg-white text-black p-5 border-4 border-black shadow-[12px_12px_0px_0px_rgba(227,6,19,1)] z-50 w-80 normal-case font-bold divide-y-2 divide-black pointer-events-none">
                                                                        <div className="pb-3 text-left">
                                                                            <span className="text-[8px] bg-[#e30613] text-white px-2 py-0.5 font-bauhaus uppercase font-bold">FICHA TÉCNICA DE TRABAJO</span>
                                                                            <h4 className="font-bauhaus text-sm mt-2 text-[#e30613] uppercase break-words">{t.title}</h4>
                                                                        </div>
                                                                        <div className="py-3 space-y-2 text-[10px] text-zinc-700 font-medium">
                                                                            <p className="font-bold text-black uppercase">
                                                                                <span className="text-[#e30613] font-bauhaus text-[9px] mr-1">SECCIÓN:</span> 
                                                                                <span className={`px-1.5 py-0.5 text-white ${sStyle.bg} border ${sStyle.border}`}>
                                                                                    {sStyle.icon} {t.section || 'N/D'}
                                                                                </span>
                                                                            </p>
                                                                            <p className="font-bold text-black uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">ASIGNADO A:</span> {t.assignedTo || 'N/D'}</p>
                                                                            <p className="font-bold text-black uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">TIEMPO ESTIMADO:</span> {t.estimatedTime || 'N/D'}</p>
                                                                            <p className="font-bold text-black uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">FECHA:</span> {t.createdAt}</p>
                                                                            <p className="font-bold text-black uppercase flex items-center gap-1">
                                                                                <span className="text-[#e30613] font-bauhaus text-[9px] mr-1">ESTADO:</span>
                                                                                <span className={`px-2 py-0.5 text-[8px] font-bauhaus ${t.status === 'completed' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}`}>
                                                                                    {t.status}
                                                                                </span>
                                                                            </p>
                                                                        </div>
                                                                        {t.description && (
                                                                            <div className="pt-3 text-left">
                                                                                <span className="text-[#e30613] font-bauhaus text-[9px] uppercase block mb-1">Observaciones:</span>
                                                                                <p className="text-zinc-600 font-medium text-[10px] normal-case whitespace-pre-wrap leading-relaxed max-h-32 overflow-y-auto pr-1">
                                                                                    {t.description}
                                                                                </p>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 font-bauhaus">
                                                                    <span className={`px-2.5 py-1 text-white border ${sStyle.bg} ${sStyle.border}`}>
                                                                        {sStyle.icon} {t.section || 'SIN SECCIÓN'}
                                                                    </span>
                                                                </td>
                                                                <td className="p-4 text-[#e30613]">{t.assignedTo}</td>
                                                                <td className="p-4">
                                                                    <span className={`px-2 py-1 font-bold ${t.status==='completed'?'bg-emerald-100 text-emerald-600':'bg-amber-100 text-amber-600'}`}>{t.status}</span>
                                                                </td>
                                                                <td className="p-4 text-right flex justify-end gap-2">
                                                                    {t.status !== 'completed' && (
                                                                        <button onClick={() => updateTaskStatus(t.id, 'completed')} className="bg-emerald-500 hover:bg-emerald-600 text-white p-1 border-2 border-black px-3 transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] font-bold">Listo</button>
                                                                    )}
                                                                    {currentUser.role === 'admin' && (
                                                                        <button onClick={() => setConfirmDelete(t.id)} className="p-1 border-2 border-black text-zinc-300 hover:text-[#e30613] hover:border-[#e30613] transition-colors"><Icons.Trash /></button>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'create' && (
                            <div className="max-w-md bg-white border-4 border-black p-4 md:p-8 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] md:shadow-[15px_15px_0px_0px_rgba(0,0,0,1)]">
                                <form className="space-y-4" onSubmit={e => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    addTask({
                                        title: fd.get('title'),
                                        description: fd.get('description'),
                                        createdAt: fd.get('date'),
                                        estimatedTime: fd.get('time'),
                                        section: fd.get('section'),
                                        assignedTo: fd.get('to')
                                    });
                                    e.target.reset();
                                }}>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Título de la Solicitud</label>
                                        <input name="title" required className="w-full p-3 border-2 border-black uppercase text-xs font-bold focus:outline-none bg-white" placeholder="Ej. Reparar puerta enrollable almacén" />
                                    </div>
                                    
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Instrucciones Detalladas</label>
                                        <textarea 
                                            name="description" 
                                            placeholder="Indique los materiales y herramientas requeridos..." 
                                            rows="3"
                                            className="w-full p-3 border-2 border-black text-xs font-bold bg-white focus:outline-none uppercase"
                                        ></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Fecha Planificación</label>
                                            <input type="date" name="date" required className="w-full p-3 border-2 border-black text-xs focus:outline-none bg-white font-bold" />
                                        </div>
                                        <div>
                                            <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Tiempo Estimado</label>
                                            <input name="time" placeholder="Ej. 1h 30m" required className="w-full p-3 border-2 border-black text-xs focus:outline-none bg-white font-bold uppercase" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Sección Afectada</label>
                                            <select name="section" className="w-full p-3 border-2 border-black uppercase text-xs font-bold bg-white focus:outline-none">
                                                {Object.entries(sectionColors).map(([name, style]) => (
                                                    <option key={name} value={name}>
                                                        {style.icon} {name}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bauhaus text-[9px] uppercase block mb-1 font-bold">Encargado Responsable</label>
                                            <select name="to" className="w-full p-3 border-2 border-black uppercase text-xs font-bold bg-white focus:outline-none">
                                                <option value="Responsable">RESPONSABLE</option>
                                                <option value="2º Responsable">2º RESPONSABLE</option>
                                                <option value="Vendedor">VENDEDOR</option>
                                                <option value="Mantenimiento">MANTENIMIENTO</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-black transition-colors mt-4 font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">Registrar Trabajo</button>
                                </form>
                            </div>
                        )}

                        {view === 'users' && currentUser.role === 'admin' && (
                            <div className="space-y-6">
                                <button onClick={() => setIsCreatingUser(true)} className="bg-black text-white p-4 px-8 font-bauhaus uppercase text-xs border-4 border-black hover:bg-[#e30613] transition-colors shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">Crear Perfil</button>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {users.map(u => (
                                        <div key={u.id} className="bg-white border-4 border-black p-4 relative shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] animate-fade-in">
                                            <p className="font-bauhaus text-xs uppercase">{u.name}</p>
                                            <p className="text-[#e30613] text-[9px] font-bold uppercase">{u.position}</p>
                                            {u.id !== currentUser.id && (
                                                <button onClick={() => deleteUser(u.id)} className="absolute top-4 right-4 text-zinc-300 hover:text-[#e30613] transition-colors"><Icons.Trash /></button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Ficha técnica Modal Móvil */}
                    {activeMobileTask && (
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-4 border-black p-6 w-full max-w-sm flex flex-col divide-y-2 divide-black max-h-[90vh] overflow-y-auto shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
                                <div className="pb-3 text-left">
                                    <span className="text-[8px] bg-[#e30613] text-white px-2 py-0.5 font-bauhaus uppercase font-bold">Ficha Técnica</span>
                                    <h4 className="font-bauhaus text-base mt-2 text-[#e30613] uppercase break-words">{activeMobileTask.title}</h4>
                                </div>
                                <div className="py-3 space-y-2.5 text-[10px] text-zinc-700 font-bold">
                                    <p className="uppercase">
                                        <span className="text-[#e30613] font-bauhaus text-[9px] mr-1">SECCIÓN:</span> 
                                        <span className={`px-2 py-0.5 text-[8px] text-white ${getSectionStyle(activeMobileTask.section).bg} border ${getSectionStyle(activeMobileTask.section).border}`}>
                                            {getSectionStyle(activeMobileTask.section).icon} {activeMobileTask.section || 'SIN SECCIÓN'}
                                        </span>
                                    </p>
                                    <p className="uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">ASIGNADO A:</span> {activeMobileTask.assignedTo || 'SIN ASIGNAR'}</p>
                                    <p className="uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">TIEMPO ESTIMADO:</span> {activeMobileTask.estimatedTime || 'N/D'}</p>
                                    <p className="uppercase"><span className="text-[#e30613] font-bauhaus text-[9px] mr-1">REGISTRADO EL:</span> {activeMobileTask.createdAt}</p>
                                    <p className="uppercase flex items-center gap-1">
                                        <span className="text-[#e30613] font-bauhaus text-[9px] mr-1">ESTADO:</span>
                                        <span className={`px-2 py-0.5 text-[8px] font-bauhaus ${activeMobileTask.status === 'completed' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}`}>
                                            {activeMobileTask.status}
                                        </span>
                                    </p>
                                </div>
                                {activeMobileTask.description && (
                                    <div className="py-3 text-left">
                                        <span className="text-[#e30613] font-bauhaus text-[9px] uppercase block mb-1">Observaciones adicionales:</span>
                                        <p className="text-zinc-600 font-medium text-[10px] normal-case whitespace-pre-wrap leading-relaxed">
                                            {activeMobileTask.description}
                                        </p>
                                    </div>
                                )}
                                <div className="pt-3">
                                    <button 
                                        onClick={() => setActiveMobileTask(null)} 
                                        className="w-full bg-black text-white p-3 font-bauhaus text-[9px] uppercase border-2 border-black hover:bg-[#e30613] active:bg-[#e30613] transition-colors font-bold"
                                    >
                                        Volver al Listado
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Ventanas de confirmación y creación de colaborador */}
                    {confirmDelete && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-8 border-[#e30613] p-8 max-w-xs w-full text-center shadow-[15px_15px_0px_0px_rgba(0,0,0,1)]">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">¿Deseas eliminar esta tarea?</h4>
                                <button onClick={() => deleteTask(confirmDelete)} className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs mb-2 hover:bg-black transition-colors font-bold shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">Eliminar Permanentemente</button>
                                <button onClick={() => setConfirmDelete(null)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black">Cancelar acción</button>
                            </div>
                        </div>
                    )}

                    {isCreatingUser && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
                            <div className="bg-white border-4 border-black p-6 max-w-sm w-full shadow-[15px_15px_0px_0px_rgba(0,0,0,1)]">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">Nuevo Colaborador</h4>
                                <form className="space-y-4" onSubmit={e => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    addUser({ 
                                        name: fd.get('n'), 
                                        position: fd.get('p'), 
                                        role: fd.get('r'), 
                                        email: 'staff@bauhaus.es' 
                                    });
                                }}>
                                    <input name="n" placeholder="Nombre completo" required className="w-full p-3 border-2 border-black font-bold text-xs focus:outline-none bg-white uppercase" />
                                    <select name="p" className="w-full p-3 border-2 border-black text-xs uppercase font-bold bg-white focus:outline-none">
                                        <option>Adjunto de comercio</option>
                                        <option>Adjunto de gestion</option>
                                        <option>Responsable de seccion</option>
                                        <option>2º responsable</option>
                                        <option>ADMINISTRADOR</option>
                                    </select>
                                    <select name="r" className="w-full p-3 border-2 border-black text-xs uppercase font-bold bg-white focus:outline-none">
                                        <option value="user">OPERARIO</option>
                                        <option value="admin">ADMINISTRADOR</option>
                                    </select>
                                    <button type="submit" className="w-full bg-black text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-[#e30613] transition-colors font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">Crear Perfil</button>
                                    <button type="button" onClick={() => setIsCreatingUser(false)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black text-center block font-bold">Cerrar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Orquestador de renderizado seguro de React
        const startApp = () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        if (window.F_SDK) {
            startApp();
        } else {
            window.mountReactApp = startApp;
        }
    </script>
</body>
</html>
