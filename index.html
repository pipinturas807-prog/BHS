    <!-- Script de Inicialización del SDK de Firebase v11 en Ámbito Global -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
        } else if (window.__firebase_config) {
            firebaseConfig = JSON.parse(window.__firebase_config);
        } else {
            // Credenciales fallback por defecto para el entorno de la tienda
            firebaseConfig = {
                apiKey: "AIzaSyALCBfhcIjR5FHvVVEPCyfHJOsysrTM6kw", 
                authDomain: "bhs807.firebaseapp.com",
                projectId: "bhs807",
                storageBucket: "bhs807.firebasestorage.app",
                messagingSenderId: "703824622381",
                appId: "1:703824622381:web:b6c965897aed3a59cad9a4"
            };
        }

        let db = null;
        let auth = null;
        let isMockFallback = false;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Fallo al conectar con Firebase en la nube. Usando base de datos local redundante.", e);
            isMockFallback = true;
        }

        window.F_SDK = {
            db, auth, isMockFallback, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            doc, collection, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot

        if (window.mountReactApp) {
            window.mountReactApp();
        }

                const ctx = new AudioContext();

                const gain = ctx.createGain();
                osc.type = 'sine';

        // Componente que incrusta el Portal de Cuadrantes (app independiente de gestión de turnos)
        // dentro de un iframe aislado, para no chocar con el estado/nombres globales de esta app.
        const CuadrantesEmbed = ({ reloadKey }) => {
            const [iframeUrl, setIframeUrl] = useState(null);
            const [loadError, setLoadError] = useState(false);

            useEffect(() => {
                let objectUrl = null;
                try {
                    const binaryStr = atob(window.CUADRANTES_HTML_B64 || '');
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                    const htmlText = new TextDecoder('utf-8').decode(bytes);
                    const blob = new Blob([htmlText], { type: 'text/html' });
                    objectUrl = URL.createObjectURL(blob);
                    setIframeUrl(objectUrl);
                    setLoadError(false);
                } catch (e) {
                    console.error('No se pudo cargar el Portal de Cuadrantes:', e);
                    setLoadError(true);
                }
                return () => { if (objectUrl) URL.revokeObjectURL(objectUrl); };
            }, [reloadKey]);

            if (loadError) {
                return html`
                    <div className="w-full h-full flex items-center justify-center bg-white text-black p-6">
                        <p className="font-bauhaus text-xs uppercase text-center">No se pudo cargar el Portal de Cuadrantes.</p>
                    </div>
                `;
            }

            if (!iframeUrl) {

                        <p className="font-bauhaus text-xs uppercase animate-pulse">Cargando Portal de Cuadrantes...</p>
                    </div>
                `;
            }

            return html`

            `;

        const App = () => {

                doc, collection, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot 
            } = sdk;

            // Se cambia localStorage por sessionStorage para forzar el re-login al cerrar la pestaña o el navegador
            const [currentUser, setCurrentUser] = useState(() => {
                const savedUser = sessionStorage.getItem(`bauhaus_active_user_${appId}`);
                return savedUser ? JSON.parse(savedUser) : null;
            });

            // Estado para el manejo de Tema Oscuro / Claro
            const [isDarkMode, setIsDarkMode] = useState(() => {
                return localStorage.getItem(`bauhaus_theme_${appId}`) === 'dark';
            });
            
            const [tasks, setTasks] = useState(() => {
                const local = localStorage.getItem(`bauhaus_tasks_${appId}`);
                return local ? JSON.parse(local) : initialTasks;
            });

            const [news, setNews] = useState(() => {
                const local = localStorage.getItem(`bauhaus_news_${appId}`);
                return local ? JSON.parse(local) : initialNews;
            });

            // Mensajes de chat en tiempo real e inicialización de notificaciones
            const [chatMessages, setChatMessages] = useState([]);
            const [activeChatChannel, setActiveChatChannel] = useState('GENERAL');
            const [chatInputText, setChatInputText] = useState('');
            const [unreadCounts, setUnreadCounts] = useState({});
            const chatEndRef = useRef(null);

            const [view, setView] = useState('dashboard');
            const [cuadrantesReloadKey, setCuadrantesReloadKey] = useState(0);
            const [isCreatingNews, setIsCreatingNews] = useState(false);
            const [confirmDelete, setConfirmDelete] = useState(null);

            // Estado para el modal de Finalizar Tarea y Aplazar Tarea
            const [completingTask, setCompletingTask] = useState(null);

            const [loading, setLoading] = useState(true);

            const [connectionError, setConnectionError] = useState('');

            const [isMobile, setIsMobile] = useState(false);

            // Estado unificado para visualización de detalles completos/persistentes de tarea (desktop y móvil)

            // Estados del login unificado y directo
            const [loginMode, setLoginMode] = useState(null); // 'admin', 'consulta' o 'direccion'

            const viewRef = useRef(view);

            // Alternar tema y guardarlo en caché

            // Helper para comprobar si el usuario actual tiene permisos globales de visualización (Solo Dirección o Administrador)
            const hasGlobalViewPrivileges = () => {

            const hasAdminPrivileges = () => {

            // Permiso dinámico para comprobar quién puede crear/publicar novedades en el Tablón Informativo
            const canCreateNews = currentUser && (

            );

            const triggerNotification = (message, type = 'success') => {
                setNotification({ show: true, message, type });
                setTimeout(() => {

            // Al iniciar sesión o refrescar, configurar los filtros predeterminados según sección del usuario
            useEffect(() => {
                if (currentUser) {

                    if (currentUser.role === 'consulta' && currentUser.section) {

                        setSelectedListSection('TODAS');

                    sessionStorage.removeItem(`bauhaus_active_user_${appId}`);

            }, [currentUser]);

            useEffect(() => {
                localStorage.setItem(`bauhaus_tasks_${appId}`, JSON.stringify(tasks));

            useEffect(() => {
                localStorage.setItem(`bauhaus_news_${appId}`, JSON.stringify(news));
            }, [news]);

            // Efecto de Auto-eliminación de tareas y novedades con más de un mes de antigüedad (30 días)
            useEffect(() => {
                if (loading === false) {
                    const cleanExpiredItems = async () => {
                        const now = new Date();
                        const thirtyDaysAgo = new Date();
                        thirtyDaysAgo.setDate(now.getDate() - 30);

                        // 1. Limpieza de tareas completadas hace más de 30 días
                        const expiredTasks = tasks.filter(t => {
                            if (t.status !== 'completed') return false;
                            const finishDateStr = t.finishedAt || t.createdAt;
                            if (!finishDateStr) return false;
                            const finishDate = new Date(finishDateStr);
                            return finishDate < thirtyDaysAgo;
                        });

                        if (expiredTasks.length > 0) {
                            const expiredIds = expiredTasks.map(t => t.id);
                            setTasks(prev => prev.filter(t => !expiredIds.includes(t.id)));
                            
                            if (db && auth.currentUser) {
                                for (const task of expiredTasks) {
                                    if (!task.id.startsWith("temp-")) {

                                            const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', task.id);
                                            await deleteDoc(taskDocRef);
                                        } catch (e) {
                                            console.error("Error auto-eliminando tarea de Firestore: ", e);
                                        }
                                    }
                                }
                            }
                        }

                        // 2. Limpieza de novedades creadas hace más de 30 días
                        const expiredNews = news.filter(n => {
                            if (!n.createdAt) return false;
                            const newsDate = new Date(n.createdAt);
                            return newsDate < thirtyDaysAgo;
                        });

                        if (expiredNews.length > 0) {
                            const expiredNewsIds = expiredNews.map(n => n.id);
                            setNews(prev => prev.filter(n => !expiredNewsIds.includes(n.id)));

                            if (db && auth.currentUser) {
                                for (const item of expiredNews) {
                                    if (!item.id.startsWith("temp-news-")) {
                                        try {
                                            const newsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'news', item.id);
                                            await deleteDoc(newsDocRef);
                                        } catch (e) {
                                            console.error("Error auto-eliminando novedad de Firestore: ", e);
                                        }
                                    }
                                }
                            }
                        }
                    };
                    cleanExpiredItems();
                }
            }, [loading, db, auth?.currentUser]);

            // Efecto de Auto-eliminación semanal del Chat (Se limpian los mensajes con más de 7 días de antigüedad)
            useEffect(() => {
                if (loading === false && chatMessages.length > 0 && !chatCleanupDone) {
                    const cleanWeeklyChats = async () => {
                        const now = new Date();
                        const sevenDaysAgo = new Date();
                        sevenDaysAgo.setDate(now.getDate() - 7);

                        const expiredChats = chatMessages.filter(m => {
                            if (!m.timestamp) return false;
                            const msgDate = new Date(m.timestamp);
                            return msgDate < sevenDaysAgo;
                        });

                        if (expiredChats.length > 0) {
                            const expiredIds = expiredChats.map(m => m.id);
                            setChatMessages(prev => prev.filter(m => !expiredIds.includes(m.id)));

                            if (db && auth.currentUser) {
                                for (const msg of expiredChats) {
                                    if (msg.id && !msg.id.startsWith("temp-")) {
                                        try {
                                            const chatDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'chats', msg.id);
                                            await deleteDoc(chatDocRef);
                                        } catch (e) {
                                            console.error("Error auto-eliminando mensaje de chat de Firestore: ", e);
                                        }
                                    }
                                }
                            }
                        }
                        setChatCleanupDone(true);
                    };
                    cleanWeeklyChats();
                }
            }, [loading, chatMessages, chatCleanupDone, db, auth?.currentUser]);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (!auth) {
                    setConnectionStatus('offline');
                    setConnectionError('SDK de Firebase no inicializado en el cliente.');
                    setLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.warn("Autenticación Firebase de respaldo local.", e);
                        setConnectionStatus('offline');
                        setFirebaseUser({ uid: "mock-user", isAnonymous: true });
                        setLoading(false);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (usr) => {
                    if (usr) setFirebaseUser(usr);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!firebaseUser || !db) {
                    setLoading(false);
                    return;
                }

                const tasksCol = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
                const newsCol = collection(db, 'artifacts', appId, 'public', 'data', 'news');
                const chatsCol = collection(db, 'artifacts', appId, 'public', 'data', 'chats');

                const unsubscribeTasks = onSnapshot(tasksCol, 
                    (snapshot) => {
                        const tasksData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        tasksData.sort((a, b) => {
                            const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
                            const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
                            return dateB - dateA;
                        });
                        setTasks(tasksData);
                        setConnectionStatus('online');
                        setConnectionError('');
                        setLoading(false);

                    (error) => {
                        setConnectionStatus('offline');
                        setConnectionError(`Error Firestore Tasks: ${error.message}`);
                        setLoading(false);
                    }
                );

                    (snapshot) => {
                        const newsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        newsData.sort((a, b) => {
                            const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
                            const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
                            return dateB - dateA;
                        });
                        setNews(newsData);
                    },
                    (error) => {
                        console.warn("Error Firestore News:", error);
                    }
                );

                const unsubscribeChats = onSnapshot(chatsCol,
                    (snapshot) => {
                        const chatsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        chatsData.sort((a, b) => {
                            const dateA = a.timestamp ? new Date(a.timestamp) : new Date(0);
                            const dateB = b.timestamp ? new Date(b.timestamp) : new Date(0);
                            return dateA - dateB;

                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        if (isNews) {
                            setNewsPhoto(compressedBase64);
                        } else {

                    ${confirmDelete && hasAdminPrivileges() ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-8 border-[#e30613] p-8 max-w-xs w-full text-center shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">¿Deseas eliminar esta tarea?</h4>
                                <button onClick=${() => deleteTask(confirmDelete)} className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs mb-2 font-bold shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">Eliminar Permanentemente</button>
                                <button onClick=${() => setConfirmDelete(null)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black">Cancelar</button>
                            </div>
                        </div>
                    ` : ''}

                    ${confirmDeleteNews && hasAdminPrivileges() ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-8 border-[#e30613] p-8 max-w-xs w-full text-center shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">¿Deseas eliminar esta novedad?</h4>
                                <button onClick=${() => deleteNews(confirmDeleteNews)} className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs mb-2 font-bold shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">Eliminar Permanentemente</button>
                                <button onClick=${() => setConfirmDeleteNews(null)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black">Cancelar</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        };

        const startApp = () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(html`<${App} />`);
        };

        if (window.F_SDK) {
            startApp();
        } else {
            window.mountReactApp = startApp;
        }
    </script>
</body>
</html>
