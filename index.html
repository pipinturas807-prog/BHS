    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración dinámica priorizando las variables provistas por el entorno para evitar fallos de permisos
        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
        } else if (window.__firebase_config) {
            firebaseConfig = JSON.parse(window.__firebase_config);
        } else {
            // Configuración real de respaldo de tu proyecto en Firebase (bhs807)
            firebaseConfig = {
                apiKey: "AIzaSyALCBfhcIjR5FHvVVEPCyfHJOsysrTM6kw", 
                authDomain: "bhs807.firebaseapp.com",
                projectId: "bhs807",
                storageBucket: "bhs807.firebasestorage.app",
                messagingSenderId: "703824622381",
                appId: "1:703824622381:web:b6c965897aed3a59cad9a4"
            };
        }

        let db = null;
        let auth = null;
        let isMockFallback = false;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Fallo al conectar con Firebase en la nube. Usando base de datos local redundante.", e);
            isMockFallback = true;
        }

        // Exponer SDK de manera limpia en objeto global para que React lo use sin colisiones de carga
        window.F_SDK = {
            db,
            auth,
            isMockFallback,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc,
            collection,
            addDoc,
            setDoc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot
        };

        // Disparar renderizado en cuanto los módulos estén listos
        if (window.mountReactApp) {
            window.mountReactApp();
        }
    </script>

        const initialUsers = [

        // Iconografía vectorial SVG de estilo Bauhaus
        const Icons = {

            Tasks: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,

            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,

            Print: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileSpreadsheet: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
        };

        const BauhausLogo = () => (
            <div className="flex gap-0.5 select-none">
                {['B', 'A', 'U', 'H', 'A', 'U', 'S'].map((char, i) => (
                    <div key={i} className="bg-[#e30613] text-white w-7 h-7 md:w-8 md:h-8 flex items-center justify-center font-black text-lg md:text-xl relative font-bauhaus shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                        {char}
                        {char === 'S' && <span className="absolute top-0.5 right-0.5 text-[5px]">®</span>}
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const sdk = window.F_SDK || {};
            const { 
                db, auth, isMockFallback, 
                signInAnonymously, signInWithCustomToken, onAuthStateChanged,
                doc, collection, addDoc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot 
            } = sdk;

            const [currentUser, setCurrentUser] = useState(() => {
                const savedUser = localStorage.getItem(`bauhaus_active_user_${appId}`);
                return savedUser ? JSON.parse(savedUser) : null;
            });
            
            // Cargar caché local de forma instantánea al iniciar la interfaz
            const [tasks, setTasks] = useState(() => {
                const local = localStorage.getItem(`bauhaus_tasks_${appId}`);
                return local ? JSON.parse(local) : initialTasks;
            });
            
            const [users, setUsers] = useState(() => {
                const local = localStorage.getItem(`bauhaus_users_${appId}`);
                return local ? JSON.parse(local) : initialUsers;
            });

            const [view, setView] = useState('dashboard');
            const [isCreatingUser, setIsCreatingUser] = useState(false);
            const [confirmDelete, setConfirmDelete] = useState(null);
            const [loading, setLoading] = useState(true);
            const [firebaseUser, setFirebaseUser] = useState(null);
            
            // Estado de conexión dinámico (nunca bloquea el guardado)
            const [connectionStatus, setConnectionStatus] = useState('connecting'); // 'connecting' | 'online' | 'offline'
            const [connectionError, setConnectionError] = useState('');

            const [isMobile, setIsMobile] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [activeMobileTask, setActiveMobileTask] = useState(null);
            const [selectedDashboardSection, setSelectedDashboardSection] = useState('TODAS');
            
            // Filtro para la pestaña de listado de tareas
            const [selectedListSection, setSelectedListSection] = useState('TODAS');

            // Calendario interactivo
            const [currentCalendarDate, setCurrentCalendarDate] = useState(new Date(2026, 4, 19)); // Mayo 2026 (por la fecha del sistema actual)
            const [selectedDayTasks, setSelectedDayTasks] = useState([]);
            const [selectedCalendarDayString, setSelectedCalendarDayString] = useState(null);

            // Formulario administrador
            const [selectedAdminUser, setSelectedAdminUser] = useState(null);
            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');

            // Estados del filtro para exportar a Excel
            const [excelFilterDate, setExcelFilterDate] = useState('');
            const [excelFilterSection, setExcelFilterSection] = useState('TODAS');
            const [excelFilterSubject, setExcelFilterSubject] = useState('');

            // Estado de filtro de impresión para el plan del día
            const [printFilterSection, setPrintFilterSection] = useState('TODAS');

            // Banner de notificaciones
            const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });

            const triggerNotification = (message, type = 'success') => {
                setNotification({ show: true, message, type });
                setTimeout(() => {
                    setNotification(prev => ({ ...prev, show: false }));
                }, 4500);
            };

            // Sincronizar usuario activo localmente
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem(`bauhaus_active_user_${appId}`, JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem(`bauhaus_active_user_${appId}`);
                }
            }, [currentUser]);

            // Guardar localmente de respaldo automático
            useEffect(() => {
                localStorage.setItem(`bauhaus_users_${appId}`, JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem(`bauhaus_tasks_${appId}`, JSON.stringify(tasks));
            }, [tasks]);

            // Adaptabilidad móvil
            useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 768);
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // RULE 3 - Autenticación previa en Firebase antes de cualquier consulta
            useEffect(() => {
                if (!auth) {
                    setConnectionStatus('offline');
                    setConnectionError('SDK de Firebase no inicializado en el cliente.');
                    setLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.warn("Autenticación Firebase rechazada, usando operario local.", e);
                        setConnectionStatus('offline');
                        setConnectionError(`Error de autenticación: ${e.message}`);
                        setFirebaseUser({ uid: "mock-user-autonomo", isAnonymous: true });
                        setLoading(false);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (usr) => {
                    if (usr) {
                        setFirebaseUser(usr);
                    }
                });
                return () => unsubscribe();
            }, []);

            // RULE 1 & 2 - Sincronización continua en tiempo real (Firestore)
            useEffect(() => {
                if (!firebaseUser || !db) {
                    setLoading(false);
                    return;
                }

                // Rutas autorizadas estrictas: /artifacts/{appId}/public/data/{collectionName}
                const tasksCol = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
                const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');

                const unsubscribeTasks = onSnapshot(tasksCol, 
                    (snapshot) => {
                        const tasksData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        // RULE 2: Ordenamiento seguro del lado del cliente en memoria para evitar errores de índices
                        tasksData.sort((a, b) => {
                            const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
                            const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
                            return dateB - dateA;
                        });
                        setTasks(tasksData);
                        setConnectionStatus('online');
                        setConnectionError('');
                        setLoading(false);
                    },
                    (error) => {
                        console.error("Fallo de lectura o permisos de Firestore en la nube:", error);
                        setConnectionStatus('offline');
                        setConnectionError(`Error de Firestore (onSnapshot): ${error.message}`);
                        setLoading(false);
                        triggerNotification(`Error de red: Mostrando datos locales guardados.`, "warning");
                    }
                );

                const unsubscribeUsers = onSnapshot(usersCol,
                    (snapshot) => {
                        const usersData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (usersData.length > 0) {
                            setUsers(usersData);
                        } else {
                            // Inicialización de perfiles en caso de base de datos vacía
                            initialUsers.forEach(async (u) => {
                                try {
                                    await addDoc(usersCol, u);
                                } catch(e) {
                                    console.warn("Fallo al inicializar usuarios en base de datos:", e);
                                }
                            });
                        }
                    },
                    (error) => {
                        console.warn("No se pudieron leer perfiles del servidor:", error);
                    }
                );

                return () => {
                    unsubscribeTasks();
                    unsubscribeUsers();
                };
            }, [firebaseUser]);

            // Controladores de Operaciones de Base de Datos Directos
            const addTask = async (taskData) => {
                const newTask = { 
                    ...taskData, 
                    status: 'pending'
                };

                // Actualización optimista local rápida
                const tempId = "temp-" + Date.now();
                setTasks(prev => [{ id: tempId, ...newTask }, ...prev]);
                setView('tasks');

                if (db && auth.currentUser) {
                    try {
                        const tasksCol = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
                        await addDoc(tasksCol, newTask);
                        triggerNotification("Tarea sincronizada y guardada en Firebase correctamente", "success");
                    } catch (e) {
                        console.error("Error al guardar en Firebase:", e);
                        triggerNotification(`Error Firebase: ${e.message}. Guardado temporal local.`, "error");
                    }
                } else {
                    triggerNotification("Guardado local (Sin conexión con el servidor Firebase)", "warning");
                }
            };

            const updateTaskStatus = async (id, newStatus) => {
                // Actualización optimista instantánea
                setTasks(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));

                if (db && auth.currentUser && !id.startsWith("temp-")) {
                    try {
                        const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', id);
                        await updateDoc(taskDocRef, { status: newStatus });
                        triggerNotification("Estado actualizado en la nube", "success");
                    } catch (e) {
                        console.error("Error al actualizar en la nube:", e);
                        triggerNotification(`Fallo de guardado en la nube: ${e.message}`, "error");
                    }
                } else {
                    triggerNotification("Guardado de forma local (Sin conexión activa a Firebase)", "warning");
                }
            };

            const deleteTask = async (id) => {
                // Actualización optimista
                setTasks(prev => prev.filter(t => t.id !== id));
                setConfirmDelete(null);

                if (db && auth.currentUser && !id.startsWith("temp-")) {
                    try {
                        const taskDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', id);
                        await deleteDoc(taskDocRef);
                        triggerNotification("Tarea eliminada en la nube con éxito", "success");
                    } catch (e) {
                        console.error("Error al eliminar del servidor:", e);
                        triggerNotification(`Fallo al borrar del servidor: ${e.message}`, "error");
                    }
                } else {
                    triggerNotification("Eliminado localmente (Sin conexión activa)", "warning");
                }
            };

            const addUser = async (userData) => {
                const tempId = "temp-u-" + Date.now();
                setUsers(prev => [...prev, { id: tempId, ...userData }]);
                setIsCreatingUser(false);

                if (db && auth.currentUser) {
                    try {
                        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                        await addDoc(usersCol, userData);
                        triggerNotification("Colaborador sincronizado con Firebase", "success");
                    } catch (e) {
                        console.error("Error al añadir usuario a Firebase:", e);
                        triggerNotification(`Fallo al enviar a Firebase: ${e.message}`, "error");
                    }
                } else {
                    triggerNotification("Colaborador registrado temporalmente de forma local", "warning");
                }
            };

            const deleteUser = async (id) => {
                setUsers(prev => prev.filter(u => u.id !== id));

                if (db && auth.currentUser && !id.startsWith("temp-u-")) {
                    try {
                        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', id);
                        await deleteDoc(userDocRef);
                        triggerNotification("Colaborador removido de Firebase", "success");
                    } catch (e) {
                        console.error("Error al eliminar colaborador de Firebase:", e);
                        triggerNotification(`Error de sincronización de borrado: ${e.message}`, "error");
                    }
                } else {
                    triggerNotification("Colaborador revocado localmente", "warning");
                }
            };

            // Copia de seguridad en JSON (Solo Administrador)
            const handleExportBackup = () => {
                try {
                    const backupData = {
                        appId,
                        backupDate: new Date().toISOString(),
                        tasks,
                        users
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `BAUHAUS_Backup_${appId}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    triggerNotification("Copia de seguridad local descargada correctamente");
                } catch (err) {
                    triggerNotification("Fallo al exportar copia de seguridad", "error");
                }
            };

            const handleImportBackup = (event) => {
                const fileReader = new FileReader();
                const file = event.target.files[0];
                if (!file) return;

                fileReader.onload = async (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (!importedData.tasks || !importedData.users) {
                            triggerNotification("Formato de backup incompatible", "error");
                            return;
                        }

                        setTasks(importedData.tasks);
                        setUsers(importedData.users);

                        if (db && auth.currentUser) {
                            triggerNotification("Iniciando manual migración de datos a Firebase...");
                            const tasksCol = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
                            for (const t of importedData.tasks) {
                                const { id, ...cleanTask } = t;
                                await addDoc(tasksCol, cleanTask);
                            }
                            triggerNotification("Datos de copia de seguridad sincronizados con la nube", "success");
                        } else {
                            triggerNotification("Base de datos local importada correctamente", "success");
                        }
                    } catch (err) {
                        triggerNotification("Error al procesar el archivo de respaldo", "error");
                    }
                };
                fileReader.readAsText(file);
            };

            // Exportar a Excel (CSV con formato en español) tareas pendientes con filtros
            const handleExportExcelWithFilters = () => {
                // Tareas pendientes o en progreso (status !== 'completed')
                let pendingTasks = tasks.filter(t => t.status !== 'completed');

                // Aplicar filtros
                if (excelFilterDate) {
                    pendingTasks = pendingTasks.filter(t => t.createdAt === excelFilterDate);
                }
                if (excelFilterSection !== 'TODAS') {
                    pendingTasks = pendingTasks.filter(t => t.section === excelFilterSection);
                }
                if (excelFilterSubject.trim()) {
                    const term = excelFilterSubject.toLowerCase().trim();
                    pendingTasks = pendingTasks.filter(t => 
                        t.title.toLowerCase().includes(term) || 
                        (t.description && t.description.toLowerCase().includes(term))
                    );
                }

                if (pendingTasks.length === 0) {
                    triggerNotification("No hay tareas pendientes con los filtros seleccionados", "warning");
                    return;
                }

                // Generar contenido del CSV con BOM (para compatibilidad de acentos con Excel en Español)
                const headers = ["Fecha Planificacion", "Seccion", "Asunto/Titulo", "Descripcion", "Encargado Responsable", "Tiempo Estimado", "Estado"];
                const csvRows = [
                    headers.join(";"),
                    ...pendingTasks.map(t => [
                        t.createdAt || "N/D",
                        t.section || "N/D",
                        (t.title || "").replace(/;/g, ",").replace(/\n/g, " "),
                        (t.description || "").replace(/;/g, ",").replace(/\n/g, " "),
                        t.assignedTo || "N/D",
                        t.estimatedTime || "N/D",
                        t.status || "N/D"
                    ].map(val => `"${val}"`).join(";"))
                ];

                const csvContent = "\uFEFF" + csvRows.join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                
                // Forzar descarga en el navegador de manera segura
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", url);
                downloadAnchor.setAttribute("download", `BAUHAUS_Tareas_Pendientes_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                
                triggerNotification(`Reporte Excel descargado: ${pendingTasks.length} tareas encontradas.`, "success");
            };

            // Imprimir tareas pendientes del día filtrando por sección
            const handlePrintTodayTasks = () => {
                const todayDateString = "2026-05-19";
                let pendingToday = tasks.filter(t => t.createdAt === todayDateString && t.status !== 'completed');

                if (printFilterSection !== 'TODAS') {
                    pendingToday = pendingToday.filter(t => t.section === printFilterSection);
                }

                if (pendingToday.length === 0) {
                    triggerNotification(`No hay tareas pendientes hoy en la sección: ${printFilterSection}`, "warning");
                    return;
                }

                // Abrir ventana temporal con estilo limpio de impresión Bauhaus
                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    triggerNotification("Permite las ventanas emergentes para poder imprimir el plan", "error");
                    return;
                }

                const tasksHTML = pendingToday.map((t, index) => `
                    <div style="border: 3px solid black; padding: 15px; margin-bottom: 20px; page-break-inside: avoid;">
                        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid black; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; font-size: 11px;">
                            <span>${getSectionStyle(t.section).icon} SECCIÓN: ${t.section}</span>
                            <span>TIEMPO: ${t.estimatedTime || 'N/D'}</span>
                        </div>
                        <h3 style="font-family: 'Archivo Black', sans-serif; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">${index + 1}. ${t.title}</h3>
                        <p style="font-size: 12px; margin: 0 0 10px 0; color: #333; text-transform: uppercase; font-weight: 500;">${t.description || 'Sin instrucciones adicionales'}</p>
                        <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; border-top: 1px solid #ccc; padding-top: 5px;">
                            <span>ENCARGADO: ${t.assignedTo}</span>
                            <span>FECHA PLAN: ${t.createdAt}</span>
                        </div>
                    </div>
                `).join('');

                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Imprimir Plan Diario Bauhaus</title>
                        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
                        <style>
                            body { font-family: 'Inter', sans-serif; margin: 40px; color: black; background: white; }
                            .font-bauhaus { font-family: 'Archivo Black', sans-serif; }
                            .header { border-bottom: 8px solid black; padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
                            .logo-container { display: flex; gap: 2px; }
                            .logo-letter { background: #e30613; color: white; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 20px; font-weight: 900; box-shadow: 2px 2px 0px 0px black; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <div>
                                <div class="logo-container">
                                    <div class="logo-letter">B</div>
                                    <div class="logo-letter">A</div>
                                    <div class="logo-letter">U</div>
                                    <div class="logo-letter">H</div>
                                    <div class="logo-letter">A</div>
                                    <div class="logo-letter">U</div>
                                    <div class="logo-letter">S</div>
                                </div>
                                <h1 class="font-bauhaus" style="font-size: 16px; margin: 10px 0 0 0; text-transform: uppercase; letter-spacing: 1px;">PLAN DE TRABAJO DIARIO</h1>
                            </div>
                            <div style="text-align: right; font-weight: bold; font-size: 12px;">
                                <p style="margin: 0;">FECHA: 19 de Mayo de 2026</p>
                                <p style="margin: 5px 0 0 0; color: #e30613; text-transform: uppercase;">SECTOR: ${printFilterSection}</p>
                            </div>
                        </div>
                        <div style="margin-bottom: 30px;">
                            ${tasksHTML}
                        </div>
                        <footer style="text-align: center; font-size: 9px; font-weight: bold; border-top: 2px solid black; padding-top: 10px; margin-top: 50px;">
                            BAUHAUS BARCELONA - DOCUMENTO INTERNO DE PLANIFICACIÓN DE TIENDA
                        </footer>
                        <script>
                            window.onload = function() {
                                window.print();
                                setTimeout(() => { window.close(); }, 500);
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            };

            // Estadísticas del Panel según Filtro de Dashboard
            const dashboardTasks = selectedDashboardSection === 'TODAS'
                ? tasks
                : tasks.filter(t => t.section === selectedDashboardSection);

            const stats = {
                pending: dashboardTasks.filter(t => t.status === 'pending').length,
                inProgress: dashboardTasks.filter(t => t.status === 'in-progress').length,
                completed: dashboardTasks.filter(t => t.status === 'completed').length,
                total: dashboardTasks.length
            };

            // Filtrado del listado general de tareas
            const listFilteredTasks = selectedListSection === 'TODAS'
                ? tasks
                : tasks.filter(t => t.section === selectedListSection);

            // Tareas pendientes del día (Hoy: 2026-05-19)
            const todayDateString = "2026-05-19";
            const todayPendingTasks = tasks.filter(t => t.createdAt === todayDateString && t.status !== 'completed');

            const reportBody = tasks.filter(t => t.status !== 'completed').map(t => `- ${t.title}`).join('%0D%0A');
            const mailto = `mailto:dirbarcelona@bauhaus.es?subject=Reporte de Tareas&body=Tareas pendientes:%0D%0A${reportBody}`;

            const handleMobileNavigation = (targetView) => {
                setView(targetView);
                setMobileMenuOpen(false);
            };

            // Lógica de Generación del Calendario
            const getDaysInMonth = (year, month) => {
                return new Date(year, month + 1, 0).getDate();
            };

            const getFirstDayOfMonth = (year, month) => {
                let day = new Date(year, month, 1).getDay();
                return day === 0 ? 6 : day - 1;
            };

            const handlePrevMonth = () => {
                setCurrentCalendarDate(prev => {
                    let year = prev.getFullYear();
                    let month = prev.getMonth() - 1;
                    if (month < 0) {
                        month = 11;
                        year -= 1;
                    }
                    return new Date(year, month, 1);
                });
            };

            const handleNextMonth = () => {
                setCurrentCalendarDate(prev => {
                    let year = prev.getFullYear();
                    let month = prev.getMonth() + 1;
                    if (month > 11) {
                        month = 0;
                        year += 1;
                    }
                    return new Date(year, month, 1);
                });
            };

            const handleDayClick = (dayNum) => {
                const year = currentCalendarDate.getFullYear();
                const month = String(currentCalendarDate.getMonth() + 1).padStart(2, '0');
                const day = String(dayNum).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                
                const filtered = tasks.filter(t => t.createdAt === dateStr);
                setSelectedDayTasks(filtered);
                setSelectedCalendarDayString(dateStr);
            };

            // Construir matriz de días para el render del calendario
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const firstDayIndex = getFirstDayOfMonth(year, month);
            const calendarDays = [];

            // Rellenar días vacíos previos
            for (let i = 0; i < firstDayIndex; i++) {
                calendarDays.push(null);
            }
            // Rellenar días del mes
            for (let i = 1; i <= daysInMonth; i++) {
                calendarDays.push(i);
            }

            const monthNames = [
                "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-neutral-100 font-bauhaus uppercase text-xs tracking-wider text-neutral-800">
                        Sincronizando con los servidores de Bauhaus y autenticando terminal...
                    </div>
                );
            }

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-neutral-100 p-4">
                        <div className="max-w-md w-full bg-white border-[4px] md:border-[6px] border-black p-6 md:p-10 shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] md:shadow-[20px_20px_0px_0px_rgba(0,0,0,1)] animate-fade-in">
                            <div className="flex flex-col items-center mb-6 md:mb-10">
                                <BauhausLogo />
                                <div className="h-1 w-full bg-black my-4 md:my-6"></div>
                                <h2 className="font-bauhaus text-lg md:text-xl uppercase">Gestión Remota</h2>
                                
                                <span className={`mt-2 text-[8px] font-bold px-2 py-0.5 tracking-widest rounded uppercase ${
                                    connectionStatus === 'online' ? 'bg-emerald-500 text-white' : 
                                    connectionStatus === 'connecting' ? 'bg-amber-400 text-black' : 'bg-[#e30613] text-white'
                                }`}>
                                    {connectionStatus === 'online' ? "Firebase Conectado" : 
                                     connectionStatus === 'connecting' ? "Sincronizando..." : "Conexión Local Activa"}
                                </span>
                            </div>

                            {selectedAdminUser ? (
                                <form onSubmit={e => {
                                    e.preventDefault();
                                    if (usernameInput === 'admin' && passwordInput === 'bcn807') {
                                        setCurrentUser(selectedAdminUser);
                                        setSelectedAdminUser(null);
                                        setUsernameInput('');
                                        setPasswordInput('');
                                        setLoginError('');
                                    } else {
                                        setLoginError('Usuario o contraseña de administrador incorrectos');
                                    }
                                }} className="space-y-4">
                                    <div className="text-center">
                                        <p className="font-bauhaus text-xs text-[#e30613] uppercase mb-4 font-bold">AUTENTICACIÓN REQUERIDA</p>
                                    </div>

                                    {loginError && (
                                        <div className="bg-red-100 border-2 border-[#e30613] text-[#e30613] p-2 text-center text-[10px] font-bold uppercase">
                                            {loginError}
                                        </div>
                                    )}

                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Usuario Administrador</label>
                                        <input 
                                            type="text"
                                            value={usernameInput}
                                            onChange={e => setUsernameInput(e.target.value)}
                                            required 
                                            className="w-full p-3 border-2 border-black text-xs font-bold focus:outline-none bg-white uppercase" 
                                            placeholder="Introduce usuario"
                                        />
                                    </div>

                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Contraseña</label>
                                        <input 
                                            type="password"
                                            value={passwordInput}
                                            onChange={e => setPasswordInput(e.target.value)}
                                            required 
                                            className="w-full p-3 border-2 border-black text-xs font-bold focus:outline-none bg-white" 
                                            placeholder="••••••••"
                                        />
                                    </div>

                                    <button type="submit" className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-black transition-colors mt-2">
                                        Ingresar al Perfil
                                    </button>

                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            setSelectedAdminUser(null);
                                            setUsernameInput('');
                                            setPasswordInput('');
                                            setLoginError('');
                                        }} 
                                        className="w-full bg-zinc-200 text-black p-2 font-bauhaus uppercase text-[9px] border-2 border-zinc-400 hover:bg-zinc-300 transition-colors"
                                    >
                                        Volver a la selección de personal
                                    </button>
                                </form>
                            ) : (
                                <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                                    <p className="text-center text-[9px] font-bold uppercase text-zinc-400 mb-2">Seleccione su perfil de trabajo:</p>
                                    {users.map(u => (
                                        <button 
                                            key={u.id} 
                                            onClick={() => {
                                                if (u.role === 'admin') {
                                                    setSelectedAdminUser(u);
                                                } else {
                                                    setCurrentUser(u);
                                                }
                                            }} 
                                            className="w-full p-3 md:p-4 border-4 border-black hover:bg-[#e30613] hover:text-white flex justify-between items-center transition-all bg-white shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]"
                                        >
                                            <div className="text-left">
                                                <p className="font-bauhaus text-xs md:text-sm uppercase">{u.name}</p>
                                                <p className="text-[8px] md:text-[9px] font-bold opacity-60 uppercase">{u.role === 'admin' ? 'ADMINISTRADOR' : u.position}</p>
                                            </div>
                                            <span className="text-xs md:text-sm font-bold">→</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col md:flex-row min-h-screen relative">
                    
                    {/* Alertas personalizadas en pantalla */}
                    {notification.show && (
                        <div className={`fixed top-4 right-4 z-50 p-4 border-4 border-black font-bauhaus text-xs uppercase shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all ${
                            notification.type === 'error' ? 'bg-[#e30613] text-white' : 
                            notification.type === 'warning' ? 'bg-amber-400 text-black' : 
                            'bg-emerald-500 text-white'
                        }`}>
                            {notification.message}
                        </div>
                    )}

                    {/* Cabecera Móvil */}
                    {isMobile && (
                        <header className="bg-black text-white p-4 flex items-center justify-between border-b-4 border-black sticky top-0 z-40">
                            <div className="flex items-center gap-3">
                                <BauhausLogo />
                                <span className={`w-2.5 h-2.5 rounded-full ${
                                    connectionStatus === 'online' ? 'bg-emerald-500' : 
                                    connectionStatus === 'connecting' ? 'bg-amber-400' : 'bg-[#e30613]'
                                }`} title={connectionError || "Estado de Conexión"}></span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                                    className="p-1 border-2 border-white hover:border-[#e30613] active:bg-[#e30613] transition-colors"
                                >
                                    {mobileMenuOpen ? <Icons.Close /> : <Icons.Menu />}
                                </button>
                            </div>
                        </header>
                    )}

                    {/* Navegación Móvil */}
                    {isMobile && mobileMenuOpen && (
                        <div className="fixed inset-x-0 top-[65px] bottom-0 bg-black/95 text-white z-40 p-6 flex flex-col justify-between border-b-8 border-[#e30613] overflow-y-auto">
                            <div className="space-y-3">
                                <button onClick={() => handleMobileNavigation('dashboard')} className={`w-full text-left p-4 flex items-center gap-3 font-bauhaus text-[11px] uppercase border-l-4 ${view==='dashboard'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Dashboard /> Dashboard de Control
                                </button>
                                <button onClick={() => handleMobileNavigation('tasks')} className={`w-full text-left p-4 flex items-center gap-3 font-bauhaus text-[11px] uppercase border-l-4 ${view==='tasks'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Tasks /> Listado de Tareas
                                </button>
                                <button onClick={() => handleMobileNavigation('create')} className={`w-full text-left p-4 flex items-center gap-3 font-bauhaus text-[11px] uppercase border-l-4 ${view==='create'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Plus /> Agregar Solicitud
                                </button>
                                {currentUser.role === 'admin' && (
                                    <button onClick={() => handleMobileNavigation('users')} className={`w-full text-left p-4 flex items-center gap-3 font-bauhaus text-[11px] uppercase border-l-4 ${view==='users'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                        <Icons.Users /> Gestión de Personal
                                    </button>
                                )}
                            </div>
                            
                            {/* Herramienta de Datos Compacta para el menú móvil */}
                            <div className="border-t border-zinc-800 pt-4 mt-4 px-2 space-y-3">
                                <div className="flex items-center gap-1.5 text-zinc-400">
                                    <Icons.FileSpreadsheet />
                                    <span className="font-bauhaus text-[9px] uppercase tracking-wider">Exportar Excel</span>
                                </div>
                                <div className="space-y-2 text-black">
                                    <input 
                                        type="date" 
                                        value={excelFilterDate} 
                                        onChange={e => setExcelFilterDate(e.target.value)} 
                                        className="w-full p-2 text-[10px] font-bold bg-white focus:outline-none border-2 border-black" 
                                    />
                                    <select 
                                        value={excelFilterSection} 
                                        onChange={e => setExcelFilterSection(e.target.value)} 
                                        className="w-full p-2 uppercase text-[10px] font-bold bg-white focus:outline-none border-2 border-black"
                                    >
                                        <option value="TODAS">🔍 TODAS LAS SECCIONES</option>
                                        {Object.entries(sectionColors).map(([name, style]) => (
                                            <option key={name} value={name}>
                                                {style.icon} {name}
                                            </option>
                                        ))}
                                    </select>
                                    <input 
                                        type="text" 
                                        value={excelFilterSubject} 
                                        onChange={e => setExcelFilterSubject(e.target.value)} 
                                        placeholder="Buscar por Asunto"
                                        className="w-full p-2 text-[10px] font-bold bg-white focus:outline-none border-2 border-black uppercase" 
                                    />
                                    <button 
                                        onClick={handleExportExcelWithFilters}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 font-bauhaus text-[9px] uppercase border-2 border-black flex items-center justify-center gap-1 transition-all"
                                    >
                                        <Icons.Download /> Descargar Excel
                                    </button>
                                </div>
                            </div>

                            <div className="border-t border-zinc-800 pt-6 mt-4">
                                <p className="font-bauhaus text-[9px] uppercase text-[#e30613]">{currentUser.role === 'admin' ? 'ADMINISTRADOR' : currentUser.position}</p>
                                <p className="font-bauhaus text-xs truncate mb-4">{currentUser.name}</p>
                                {currentUser.role === 'admin' && (
                                    <a href={mailto} className="flex items-center justify-center gap-2 text-[10px] text-black bg-white hover:text-white hover:bg-[#e30613] transition-colors p-3 font-bold uppercase mb-4 border border-zinc-700">
                                        <Icons.Mail /> Enviar Reporte General
                                    </a>
                                )}
                                <button onClick={() => { setCurrentUser(null); setMobileMenuOpen(false); }} className="w-full p-3 bg-[#e30613] text-white font-bauhaus text-[10px] uppercase border-2 border-black hover:bg-white hover:text-black transition-all">
                                    Cerrar Perfil
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Menú de Escritorio (Barra Lateral Izquierda) */}
                    {!isMobile && (
                        <nav className="w-64 bg-black text-white p-6 flex flex-col shrink-0">
                            <div className="bg-white p-4 mb-8 flex flex-col items-center justify-center border-b-4 border-black gap-2 shrink-0">
                                <BauhausLogo />
                                <div className="flex items-center gap-1.5 mt-1">
                                    <span className={`w-2.5 h-2.5 rounded-full ${
                                        connectionStatus === 'online' ? 'bg-emerald-500 animate-pulse' : 
                                        connectionStatus === 'connecting' ? 'bg-amber-400' : 'bg-[#e30613]'
                                    }`}></span>
                                    <span className="text-[7px] text-zinc-600 font-bold uppercase tracking-wider">
                                        {connectionStatus === 'online' ? 'Firebase Conectado' : 
                                         connectionStatus === 'connecting' ? 'Sincronizando' : 'Modo Offline'}
                                    </span>
                                </div>
                            </div>
                            
                            {/* Enlaces de Navegación del Sistema */}
                            <div className="space-y-2 shrink-0">
                                <button onClick={() => setView('dashboard')} className={`w-full text-left p-3 flex items-center gap-3 font-bauhaus text-[10px] uppercase border-l-4 ${view==='dashboard'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Dashboard /> Dashboard de Control
                                </button>
                                <button onClick={() => setView('tasks')} className={`w-full text-left p-3 flex items-center gap-3 font-bauhaus text-[10px] uppercase border-l-4 ${view==='tasks'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Tasks /> Listado de Tareas
                                </button>
                                <button onClick={() => setView('create')} className={`w-full text-left p-3 flex items-center gap-3 font-bauhaus text-[10px] uppercase border-l-4 ${view==='create'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                    <Icons.Plus /> Agregar Solicitud
                                </button>
                                {currentUser.role === 'admin' && (
                                    <button onClick={() => setView('users')} className={`w-full text-left p-3 flex items-center gap-3 font-bauhaus text-[10px] uppercase border-l-4 ${view==='users'?'border-[#e30613] bg-zinc-800':'border-transparent text-zinc-500'}`}>
                                        <Icons.Users /> Gestión de Personal
                                    </button>
                                )}
                            </div>

                            {/* NUEVA INTEGRACIÓN COMPACTA: Herramienta de Datos en Barra Lateral */}
                            <div className="mt-8 border-t border-zinc-800 pt-6 space-y-3 flex-grow overflow-y-auto">
                                <div className="flex items-center gap-2 text-zinc-400">
                                    <Icons.FileSpreadsheet />
                                    <span className="font-bauhaus text-[9px] uppercase tracking-wider font-bold">Herramienta de Datos</span>
                                </div>
                                <div className="space-y-2 text-black">
                                    <div>
                                        <label className="font-bauhaus text-[8px] text-zinc-400 uppercase block mb-1">Fecha</label>
                                        <input 
                                            type="date" 
                                            value={excelFilterDate} 
                                            onChange={e => setExcelFilterDate(e.target.value)} 
                                            className="w-full p-2 text-[10px] font-bold bg-white focus:outline-none border border-zinc-700" 
                                        />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[8px] text-zinc-400 uppercase block mb-1">Sección</label>
                                        <select 
                                            value={excelFilterSection} 
                                            onChange={e => setExcelFilterSection(e.target.value)} 
                                            className="w-full p-2 uppercase text-[10px] font-bold bg-white focus:outline-none border border-zinc-700"
                                        >
                                            <option value="TODAS">🔍 TODAS</option>
                                            {Object.entries(sectionColors).map(([name, style]) => (
                                                <option key={name} value={name}>
                                                    {style.icon} {name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[8px] text-zinc-400 uppercase block mb-1">Asunto</label>
                                        <input 
                                            type="text" 
                                            value={excelFilterSubject} 
                                            onChange={e => setExcelFilterSubject(e.target.value)} 
                                            placeholder="Buscar asunto..."
                                            className="w-full p-2 text-[10px] font-bold bg-white focus:outline-none border border-zinc-700 uppercase" 
                                        />
                                    </div>
                                    <button 
                                        onClick={handleExportExcelWithFilters}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 font-bauhaus text-[9px] uppercase border border-black flex items-center justify-center gap-1 transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-0.5 active:shadow-none"
                                    >
                                        <Icons.Download /> Exportar Excel
                                    </button>
                                </div>
                            </div>

                            {/* Información de Sesión y Reporte Diario */}
                            <div className="mt-4 border-t border-zinc-800 pt-4 shrink-0">
                                <p className="font-bauhaus text-[9px] uppercase text-[#e30613]">{currentUser.role === 'admin' ? 'ADMINISTRADOR' : currentUser.position}</p>
                                <p className="font-bauhaus text-[10px] truncate mb-4">{currentUser.name}</p>
                                {currentUser.role === 'admin' && (
                                    <a href={mailto} className="flex items-center gap-2 text-[8px] text-zinc-400 hover:text-white mb-6 uppercase border border-zinc-700 p-2 block text-center">
                                        <Icons.Mail /> Enviar Reporte Diario
                                    </a>
                                )}
                                <button onClick={() => setCurrentUser(null)} className="w-full p-2 bg-white text-black font-bauhaus text-[9px] uppercase border-2 border-black hover:bg-[#e30613] hover:text-white transition-colors">
                                    Cerrar Sesión
                                </button>
                            </div>
                        </nav>
                    )}

                    {/* Sección Principal de Contenidos */}
                    <main className="flex-grow p-4 md:p-12 animate-fade-in">
                        <div className="flex justify-between items-start border-b-4 md:border-b-8 border-black pb-2 md:pb-4 mb-6 md:mb-12">
                            <h1 className="font-bauhaus text-3xl md:text-5xl uppercase">
                                {view === 'dashboard' ? 'Panel de Control' : view === 'tasks' ? 'Listado' : view === 'users' ? 'Personal' : 'Crear Solicitud'}
                            </h1>
                            
                            {/* Panel de estado de conexión detallado en escritorio */}
                            {!isMobile && connectionError && (
                                <div className="bg-red-50 border-2 border-[#e30613] text-[#e30613] text-[8px] font-bold p-2 uppercase max-w-xs rounded shadow-sm">
                                    Advertencia: {connectionError}
                                </div>
                            )}
                        </div>

                        {view === 'dashboard' && (
                            <div className="space-y-12">
                                <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                                    
                                    {/* Estadísticas globales por sección */}
                                    <div className="xl:col-span-2 bg-white border-4 border-black p-4 md:p-8 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] md:shadow-[15px_15px_0px_0px_rgba(0,0,0,1)]">
                                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 md:mb-8 pb-4 border-b-2 border-zinc-100">
                                            <h3 className="font-bauhaus text-lg md:text-xl uppercase">Estadísticas por Sección</h3>
                                            
                                            <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
                                                <span className="font-bauhaus text-[9px] uppercase text-zinc-500">Sección:</span>
                                                <select 
                                                    value={selectedDashboardSection} 
                                                    onChange={(e) => setSelectedDashboardSection(e.target.value)}
                                                    className="p-2 border-2 border-black uppercase text-[10px] font-bold bg-white focus:outline-none flex-grow sm:flex-grow-0"
                                                >
                                                    <option value="TODAS">🔍 Todas las Secciones</option>
                                                    {Object.entries(sectionColors).map(([name, style]) => (
                                                        <option key={name} value={name}>
                                                            {style.icon} {name}
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="space-y-6 md:space-y-8">
                                            {[
                                                { label: 'Pendientes', count: stats.pending, color: 'bg-[#e30613]' },
                                                { label: 'En Proceso', count: stats.inProgress, color: 'bg-amber-400' },
                                                { label: 'Completadas', count: stats.completed, color: 'bg-emerald-500' }
                                            ].map(item => (
                                                <div key={item.label} className="space-y-2">
                                                    <div className="flex justify-between font-bauhaus text-[10px] uppercase">
                                                        <span>{item.label}</span>
                                                        <span className="text-xl md:text-2xl">{item.count}</span>
                                                    </div>
                                                    <div className="h-6 md:h-8 bg-zinc-100 border-2 border-black relative">
                                                        <div className={`h-full ${item.color} transition-all`} style={{width: `${stats.total ? (item.count/stats.total)*100 : 0}%`}}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <div className="mt-6 md:mt-8 pt-4 border-t-2 border-zinc-100 flex justify-between items-center">
                                            <span className="font-bauhaus text-[9px] md:text-[10px] uppercase text-zinc-400">Total de órdenes activas</span>
                                            <span className="font-bauhaus text-base md:text-lg">{stats.total}</span>
                                        </div>
                                    </div>

                                    {/* Calendario Bauhaus Interactivo */}
                                    <div className="bg-white border-4 border-black p-4 md:p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center justify-between border-b-2 border-black pb-3 mb-4">
                                                <span className="bg-black text-white font-bauhaus text-[9px] uppercase px-2 py-0.5 font-bold flex items-center gap-1">
                                                    <Icons.Calendar /> Planificación
                                                </span>
                                                <div className="flex items-center gap-1">
                                                    <button onClick={handlePrevMonth} className="p-1 border border-black hover:bg-neutral-200"><Icons.ChevronLeft /></button>
                                                    <span className="font-bauhaus text-[9px] uppercase font-bold mx-1">{monthNames[month]} {year}</span>
                                                    <button onClick={handleNextMonth} className="p-1 border border-black hover:bg-neutral-200"><Icons.ChevronRight /></button>
                                                </div>
                                            </div>

                                            {/* Cabecera días de la semana */}
                                            <div className="grid grid-cols-7 gap-1 text-center font-bauhaus text-[8px] text-neutral-500 uppercase mb-2">
                                                <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                                            </div>

                                            {/* Rejilla de días */}
                                            <div className="grid grid-cols-7 gap-1">
                                                {calendarDays.map((dayNum, idx) => {
                                                    if (dayNum === null) {
                                                        return <div key={`empty-${idx}`} className="h-8 md:h-10 bg-neutral-50 border border-neutral-200 opacity-30"></div>;
                                                    }

                                                    const paddedMonth = String(month + 1).padStart(2, '0');
                                                    const paddedDay = String(dayNum).padStart(2, '0');
                                                    const dateStr = `${year}-${paddedMonth}-${paddedDay}`;
                                                    
                                                    // Buscar si hay tareas este día
                                                    const dayTasks = tasks.filter(t => t.createdAt === dateStr);
                                                    const hasTasks = dayTasks.length > 0;
                                                    
                                                    // Determinar colores dominantes de sección para pintar el día
                                                    let customStyle = {};
                                                    if (hasTasks) {
                                                        const firstTaskSection = dayTasks[0].section;
                                                        const styleObj = getSectionStyle(firstTaskSection);
                                                        // Borde Bauhaus fuerte con color de la sección
                                                        customStyle = { border: `3px solid ${styleObj.hex}` };
                                                    }

                                                    // Resaltar día seleccionado actualmente
                                                    const isSelected = selectedCalendarDayString === dateStr;

                                                    return (
                                                        <button 
                                                            key={`day-${dayNum}`}
                                                            onClick={() => handleDayClick(dayNum)}
                                                            style={customStyle}
                                                            className={`h-8 md:h-10 flex flex-col justify-between p-1 border text-left relative transition-all ${
                                                                isSelected ? 'bg-red-100 font-extrabold border-black ring-2 ring-black' : 'border-neutral-200'
                                                            }`}
                                                        >
                                                            <span className="text-[9px] font-bold">{dayNum}</span>
                                                            {hasTasks && (
                                                                <div className="flex gap-0.5 max-w-full overflow-hidden">
                                                                    {dayTasks.map((t, tIdx) => {
                                                                        const sectionStyle = getSectionStyle(t.section);
                                                                        return (
                                                                            <span 
                                                                                key={t.id || tIdx} 
                                                                                title={`${t.section}: ${t.title}`}
                                                                                className={`w-1.5 h-1.5 rounded-full inline-block shrink-0 ${sectionStyle.bg}`}
                                                                            ></span>
                                                                        );
                                                                    })}
                                                                </div>
                                                            )}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Detalle del día seleccionado en el calendario */}
                                        {selectedCalendarDayString && (
                                            <div className="mt-4 pt-3 border-t-2 border-black">
                                                <p className="font-bauhaus text-[8px] uppercase text-zinc-400">Tareas para {selectedCalendarDayString}:</p>
                                                {selectedDayTasks.length === 0 ? (
                                                    <p className="text-[9px] font-bold text-neutral-500 uppercase mt-1">No hay tareas programadas.</p>
                                                ) : (
                                                    <div className="space-y-1.5 mt-2 max-h-24 overflow-y-auto pr-1">
                                                        {selectedDayTasks.map(t => {
                                                            const style = getSectionStyle(t.section);
                                                            return (
                                                                <div 
                                                                    key={t.id} 
                                                                    onClick={() => {
                                                                        if (isMobile) {
                                                                            setActiveMobileTask(t);
                                                                        } else {
                                                                            setView('tasks');
                                                                        }
                                                                    }}
                                                                    className="p-1 px-2 border border-black flex justify-between items-center text-[9px] font-bold uppercase bg-white cursor-pointer hover:bg-neutral-50 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]"
                                                                >
                                                                    <span className="truncate max-w-[120px]">{t.title}</span>
                                                                    <span className={`px-1 text-[7px] text-white ${style.bg} border ${style.border}`}>
                                                                        {t.section}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Vista de Tareas Pendientes del Día debajo del Dashboard */}
                                <div className="bg-white border-4 border-black p-4 md:p-8 shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
                                    <div className="border-b-4 border-black pb-3 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                        <div>
                                            <span className="bg-[#e30613] text-white font-bauhaus text-[8px] uppercase px-2 py-0.5 font-bold">Plan de Hoy</span>
                                            <h3 className="font-bauhaus text-lg md:text-xl uppercase mt-1">Tareas pendientes del día ({todayDateString})</h3>
                                        </div>
                                        
                                        {/* Opción de Impresión por Sección */}
                                        <div className="flex flex-wrap items-center gap-3 bg-neutral-100 p-2.5 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                            <span className="font-bauhaus text-[9px] uppercase text-zinc-600">Sección:</span>
                                            <select 
                                                value={printFilterSection} 
                                                onChange={e => setPrintFilterSection(e.target.value)} 
                                                className="p-1 border border-black uppercase text-[10px] bg-white font-bold"
                                            >
                                                <option value="TODAS">🖨️ TODAS</option>
                                                {Object.entries(sectionColors).map(([name, style]) => (
                                                    <option key={name} value={name}>
                                                        {style.icon} {name}
                                                    </option>
                                                ))}
                                            </select>
                                            <button 
                                                onClick={handlePrintTodayTasks}
                                                className="bg-black text-white hover:bg-[#e30613] text-[9px] font-bauhaus px-3 py-1.5 uppercase flex items-center gap-1 transition-colors border border-black"
                                            >
                                                <Icons.Print /> Imprimir Plan
                                            </button>
                                        </div>
                                    </div>

                                    {todayPendingTasks.length === 0 ? (
                                        <div className="bg-neutral-50 border-2 border-dashed border-zinc-300 p-8 text-center uppercase font-bauhaus text-[10px] text-zinc-400">
                                            ¡Todo despejado! No quedan tareas pendientes registradas para el día de hoy.
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                            {todayPendingTasks.map(t => {
                                                const sStyle = getSectionStyle(t.section);
                                                return (
                                                    <div key={t.id} className="border-2 border-black p-4 bg-white relative flex flex-col justify-between shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] animate-fade-in">
                                                        <div>
                                                            <div className="flex items-start justify-between gap-2 mb-2">
                                                                <span className={`text-[8px] font-bold px-2 py-0.5 uppercase ${sStyle.bg} ${sStyle.text} border ${sStyle.border}`}>
                                                                    {sStyle.icon} {t.section}
                                                                </span>
                                                                <span className="text-[8px] text-neutral-400 font-bold">{t.estimatedTime}</span>
                                                            </div>
                                                            <h4 className="font-bauhaus text-xs text-neutral-900 uppercase mb-2 break-words leading-tight">{t.title}</h4>
