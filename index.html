        // Sintetizador nativo de sonido de campana/chime (Web Audio API) para notificaciones en tiempo real
        const playChime = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                
                // Nota primaria: Campana de tono alto (B5)
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, ctx.currentTime); 
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);

                // Armonía secundaria con un breve desfase para darle calidez metálica (E6)
                setTimeout(() => {
                    if (ctx.state === 'closed') return;
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1318.51, ctx.currentTime); 
                    gain2.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.6);
                }, 80);
            } catch (e) {
                console.log("Reproducción de audio bloqueada por políticas de autoplay del navegador.", e);
            }
        };

                const reader = new FileReader();

                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        if (isNews) {

                        }

                    img.src = e.target.result;

                                }}>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1 block font-bold text-black">Título de la Novedad</label>
                                        <input name="title" required className="w-full p-3 border-2 border-black uppercase text-xs font-bold text-black bg-white focus:outline-none" placeholder="Ej. Comunicado de Dirección" />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1 block font-bold text-black">Categoría de Información</label>
                                        <select name="category" required className="w-full p-3 border-2 border-black uppercase text-xs font-bold text-black bg-white focus:outline-none">
                                            <option value="COMUNICADO">Comunicado</option>
                                            <option value="IMPLANTACIÓN">Implantación</option>
                                            <option value="PRODUCTO NUEVO">Producto Nuevo</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1 block font-bold text-black">Información de Novedad</label>
                                        <textarea name="description" rows="4" required className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" placeholder="Detalla la novedad o comunicado general."></textarea>
                                    </div>

                                    <div className="border-2 border-black p-4 bg-neutral-50 space-y-3">
                                        <span className="font-bauhaus text-[9px] uppercase tracking-wider block font-bold text-black border-b border-black pb-1">FOTOGRAFÍA ADJUNTA</span>
                                        
                                        <div className="flex gap-2">
                                            <button 
                                                type="button" 
                                                onClick=${triggerNewsFileSelect}
                                                className="flex-1 bg-white hover:bg-neutral-100 text-black border-2 border-black p-2.5 font-bauhaus text-[9px] uppercase flex items-center justify-center gap-1.5 transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
                                            >
                                                <${Icons.ImageIcon} /> Archivo
                                            </button>
                                            <button 
                                                type="button" 
                                                onClick=${triggerNewsCameraCapture}
                                                className="flex-1 bg-[#e30613] hover:bg-black text-white border-2 border-black p-2.5 font-bauhaus text-[9px] uppercase flex items-center justify-center gap-1.5 transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
                                            >
                                                <${Icons.Camera} /> Cámara
                                            </button>
                                        </div>

                                        <input 
                                            type="file" 
                                            ref=${newsFileInputRef} 
                                            accept="image/*" 
                                            onChange=${handleNewsFileChange} 
                                            className="hidden" 
                                        />
                                        <input 
                                            type="file" 
                                            ref=${newsCameraInputRef} 
                                            accept="image/*" 
                                            capture="environment" 
                                            onChange=${handleNewsCameraCapture} 
                                            className="hidden" 
                                        />

                                        ${newsPhoto ? html`
                                            <div className="relative mt-2 border-2 border-black bg-white p-2">
                                                <img src=${newsPhoto} alt="Previsualización novedad" className="max-h-36 mx-auto object-contain border border-neutral-300" />
                                                <button 
                                                    type="button" 
                                                    onClick=${removeNewsAttachedPhoto}
                                                    className="absolute top-1 right-1 bg-black text-white hover:bg-[#e30613] w-6 h-6 flex items-center justify-center font-bold text-xs border border-white"
                                                    title="Eliminar foto"
                                                >
                                                    ×
                                                </button>
                                            </div>
                                        ` : ''}
                                    </div>

                                    <div className="pt-2">
                                        <button type="submit" className="w-full bg-black text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-[#e30613] transition-colors font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                            Guardar y Publicar
                                        </button>
                                        <button type="button" onClick=${() => { setIsCreatingNews(false); removeNewsAttachedPhoto(); }} className="w-full text-zinc-500 font-bauhaus uppercase text-[9px] py-4 hover:text-black text-center block font-bold">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    ` : ''}

                    ${completingTask ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-4 border-black p-6 max-w-sm w-full shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-2 font-bold text-center">Finalizar Tarea</h4>
                                <p className="text-[10px] text-[#e30613] font-bold uppercase mb-6 text-center line-clamp-2">${completingTask.title}</p>
                                
                                <form className="space-y-4" onSubmit=${handleCompleteSubmit}>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Persona que realiza la tarea</label>
                                        <input name="finisher" required className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" placeholder="Nombre de quien finaliza" />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Nombre específico del vendedor</label>
                                        <input name="vendedor" required className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" placeholder="Nombre del vendedor" />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Día de finalización</label>
                                        <input type="date" name="finishDate" required defaultValue=${todayDateStr} className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" />
                                    </div>
                                    <div className="pt-4">
                                        <button type="submit" className="w-full bg-black text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-zinc-800 transition-colors font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                            Guardar y Finalizar
                                        </button>
                                        <button type="button" onClick=${() => setCompletingTask(null)} className="w-full text-zinc-500 font-bauhaus uppercase text-[9px] py-4 hover:text-black font-bold text-center block">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Modal de Aplazar Tarea -->
                    ${postponingTask ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-4 border-black p-6 max-w-sm w-full shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-2 font-bold text-center">Aplazar Tarea</h4>
                                <p className="text-[10px] text-[#e30613] font-bold uppercase mb-6 text-center line-clamp-2">${postponingTask.title}</p>
                                
                                <form className="space-y-4" onSubmit=${handlePostponeSubmit}>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Nuevo Día de Finalización</label>
                                        <input type="date" name="postponedDate" required defaultValue=${todayDateStr} className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Persona Solicitante</label>
                                        <input name="requester" required className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" placeholder="Nombre del solicitante" />
                                    </div>
                                    <div>
                                        <label className="font-bauhaus text-[9px] uppercase block mb-1">Motivo del Aplazamiento</label>
                                        <textarea name="reason" required rows="3" className="w-full p-3 border-2 border-black text-xs font-bold uppercase text-black bg-white focus:outline-none" placeholder="Escribe el motivo detallado..."></textarea>
                                    </div>
                                    <div className="pt-4">
                                        <button type="submit" className="w-full bg-black text-white p-4 font-bauhaus uppercase text-xs border-2 border-black hover:bg-zinc-850 transition-colors font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                            Guardar y Aplazar
                                        </button>
                                        <button type="button" onClick=${() => setPostponingTask(null)} className="w-full text-zinc-500 font-bauhaus uppercase text-[9px] py-4 hover:text-black font-bold text-center block">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    ` : ''}

                    ${activeMobileNews ? html`
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white text-black border-4 border-black p-6 w-full max-w-sm flex flex-col divide-y-2 divide-black max-h-[90vh] overflow-y-auto shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
                                <div className="pb-3 text-left">
                                    <span className="text-[8px] bg-[#e30613] text-white px-2 py-0.5 font-bauhaus uppercase font-bold">${activeMobileNews.category}</span>
                                    <h4 className="font-bauhaus text-base mt-2 text-[#e30613] uppercase break-words">${activeMobileNews.title}</h4>
                                </div>

                                ${activeMobileNews.image ? html`
                                    <div className="py-3 flex justify-center bg-neutral-100 border-b-2 border-black cursor-pointer" onClick=${() => setFullScreenImage(activeMobileNews.image)}>
                                        <img src=${activeMobileNews.image} alt=${activeMobileNews.title} className="max-h-48 object-contain" />
                                    </div>
                                ` : ''}

                                <div className="py-3 space-y-2 text-[10px] text-zinc-700 font-bold">
                                    <p className="uppercase whitespace-pre-wrap font-medium text-black">${activeMobileNews.description}</p>
                                    <p className="uppercase text-[8px] text-zinc-400 mt-2">Publicado: ${activeMobileNews.createdAt}</p>
                                    <p className="uppercase text-[8px] text-zinc-500">Autor: ${activeMobileNews.author}</p>
                                </div>
                                <div className="pt-3">
                                    <button onClick=${() => setActiveMobileNews(null)} className="w-full bg-black text-white p-3 font-bauhaus text-[9px] uppercase border-2 border-black hover:bg-[#e30613] transition-colors font-bold">
                                        Volver
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${confirmDelete && hasAdminPrivileges() ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-8 border-[#e30613] p-8 max-w-xs w-full text-center shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">¿Deseas eliminar esta tarea?</h4>
                                <button onClick=${() => deleteTask(confirmDelete)} className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs mb-2 font-bold shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">Eliminar Permanentemente</button>
                                <button onClick=${() => setConfirmDelete(null)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black">Cancelar</button>
                            </div>
                        </div>
                    ` : ''}

                    ${confirmDeleteNews && hasAdminPrivileges() ? html`
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white border-8 border-[#e30613] p-8 max-w-xs w-full text-center shadow-[15px_15px_0px_0px_rgba(0,0,0,1)] text-black">
                                <h4 className="font-bauhaus text-lg uppercase mb-6 font-bold">¿Deseas eliminar esta novedad?</h4>
                                <button onClick=${() => deleteNews(confirmDeleteNews)} className="w-full bg-[#e30613] text-white p-4 font-bauhaus uppercase text-xs mb-2 font-bold shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">Eliminar Permanentemente</button>
                                <button onClick=${() => setConfirmDeleteNews(null)} className="w-full text-zinc-400 font-bauhaus uppercase text-[9px] py-2 hover:text-black">Cancelar</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        };

        const startApp = () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(html`<${App} />`);
        };

        if (window.F_SDK) {
            startApp();
        } else {
            window.mountReactApp = startApp;
        }
    </script>
</body>
</html>
